name: CI validation
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

jobs:
  linting:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Lint Code
        uses: astral-sh/ruff-action@v4.1.0
        continue-on-error: true
        with:
          src: ./src
  secret_scanning:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN  }}
  unit_test:
    runs-on: self-hosted
    needs: [linting, secret_scanning]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Run unit test
        run: echo "Running unit tests.."
      - name: Generate code coverage
        run: echo "Code coverage..."
      # - name: Upload as pipeline artifact
      #   uses: actions/upload-artifact@v7.0.1
        # with:
        #   - name: Code Coverage
        #     path: Sample path